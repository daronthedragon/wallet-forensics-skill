<svg xmlns="http://www.w3.org/2000/svg" width="838" height="427" viewBox="0 0 838 427" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="13.5" role="img">
<title>wallet-forensics skill</title>
<rect width="838" height="427" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0 10a10 10 0 0 1 10-10h818a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
<line x1="0" y1="36" x2="838" y2="36" stroke="#30363d"/>
<circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
<circle cx="39" cy="18" r="5.5" fill="#febc2e"/>
<circle cx="58" cy="18" r="5.5" fill="#28c840"/>
<text x="419" y="22.5" text-anchor="middle" fill="#8b949e" font-size="12">wallet-forensics skill</text>
<text y="65.5" textLength="793.80" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">node scripts/forensics.mjs 0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045 --chain base --no-mev --text</tspan></text>
<text y="104.7" textLength="145.80" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  WALLET FORENSICS</tspan></text>
<text y="124.2" textLength="583.20" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  ──────────────────────────────────────────────────────────────────────</tspan></text>
<text y="143.8" textLength="267.30" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  Portfolio (nominal)      $5,998</tspan></text>
<text y="163.4" textLength="234.90" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  Realized PnL             $0</tspan></text>
<text y="182.9" textLength="234.90" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  Unrealized PnL           $0</tspan></text>
<text y="202.5" textLength="259.20" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  Fees burned              $0.00</tspan></text>
<text y="241.7" textLength="413.10" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  BASE — 0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045</tspan></text>
<text y="261.3" textLength="631.80" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">    note: History unavailable from blockscout: blockscout 429 on tokentx. PnL,</tspan></text>
<text y="280.8" textLength="631.80" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">    fee totals and MEV detection are omitted; balances and approvals are still</tspan></text>
<text y="300.4" textLength="615.60" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">    reported. Setting ETHERSCAN_API_KEY switches to Etherscan, which is more</tspan></text>
<text y="320.0" textLength="105.30" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">    complete.</tspan></text>
<text y="339.6" textLength="615.60" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">    note: Approval scan was degraded: this RPC rejects unbounded eth_getLogs</tspan></text>
<text y="359.1" textLength="591.30" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">    and no approve() calls were found in the fetched history. Coverage is</tspan></text>
<text y="378.7" textLength="615.60" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">    incomplete — use an Alchemy/Infura endpoint for a full scan. Do not read</tspan></text>
<text y="398.3" textLength="267.30" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">    this as &quot;no risky approvals&quot;.</tspan></text>
</svg>
